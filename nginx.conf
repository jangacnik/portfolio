server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  error_page 404 /404.html;

  # Umami runs in the cluster. Only tracking and this site's public visitor total are exposed here.
  # A variable upstream makes nginx resolve at request time, so the site still starts while Umami is down.
  resolver 10.96.0.10 valid=30s ipv6=off;
  set $umami http://umami.default.svc.cluster.local:3000;

  location = /stats/script.js {
    proxy_pass $umami/script.js;
  }

  location = /stats/api/send {
    limit_except POST { deny all; }
    proxy_pass $umami/api/send;
  }

  location = /stats/api/share/RLhb1p4ToIgsMuNQ {
    limit_except GET { deny all; }
    proxy_pass $umami/api/share/RLhb1p4ToIgsMuNQ;
  }

  location = /stats/api/websites/0ef73d4d-2641-42ca-9066-df1cb633e6f7/stats {
    limit_except GET { deny all; }
    proxy_pass $umami/api/websites/0ef73d4d-2641-42ca-9066-df1cb633e6f7/stats$is_args$args;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = / {
    try_files /index.html =404;
  }

  location = /mtg {
    try_files /mtg/index.html =404;
  }

  location = /mtg/ {
    return 301 /mtg;
  }

  location / {
    try_files $uri =404;
  }
}
